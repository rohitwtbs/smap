name: Security scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build --no-cache

      - name: Run Bandit
        run: |
          # B105, B106, B107 (hardcoded password checks) cause internal errors in Python 2.7 with certain AST structures
          # We write to bandit-report.json in the current dir, which is mounted to the host.
          docker compose run --rm --no-deps smap bandit -r python/smap/ -f json -o bandit-report.json -s B105,B106,B107 || true
          cat bandit-report.json

      - name: Run Safety
        run: |
          # Redirecting stdout on the host to capture the JSON report
          docker compose run --rm --no-deps smap safety check --file python/requirements.txt --json > safety-report.json || true
          cat safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
