stages:
  - build
  - security
  - test

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

image: docker:24.0.5

services:
  - docker:24.0.5-dind

before_script:
  - docker info

# Build the test image once
build:
  stage: build
  script:
    - docker build -t smap:ci .

# Run security scans
security_scan:
  stage: security
  script:
    - docker build -t smap:ci .
    - |
      # B105, B106, B107 (hardcoded password checks) cause internal errors in Python 2.7
      docker run --rm smap:ci bandit -r python/smap/ -f json -o bandit-report.json -s B105,B106,B107 || true
    - docker run --rm smap:ci safety check --file python/requirements.txt --json > safety-report.json || true
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - safety-report.json

# Run core library and operator unit tests
unit_tests:
  stage: test
  script:
    - docker build -t smap:ci .
    - docker run --rm smap:ci trial smap.test smap.ops.test

# Run archiver-specific tests
archiver_tests:
  stage: test
  script:
    - docker build -t smap:ci .
    - docker run --rm smap:ci trial smap.archiver.test

# Verify schema validation logic
schema_tests:
  stage: test
  script:
    - docker build -t smap:ci .
    - docker run --rm smap:ci bash -c "cd schema/test && python test.py"
