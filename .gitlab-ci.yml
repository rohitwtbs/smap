stages:
  - build
  - test

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

image: docker:24.0.5

services:
  - docker:24.0.5-dind

before_script:
  - docker info

# Build the test image once (re-used via local cache in most runners)
build:
  stage: build
  script:
    - docker build -t smap:ci .

# Run core library and operator unit tests
unit_tests:
  stage: test
  script:
    - docker build -t smap:ci .
    - docker run --rm smap:ci trial smap.test smap.ops.test

# Run archiver-specific tests (often require more setup, but tscache is pure unit)
archiver_tests:
  stage: test
  script:
    - docker build -t smap:ci .
    - docker run --rm smap:ci trial smap.archiver.test

# Verify schema validation logic
schema_tests:
  stage: test
  script:
    - docker build -t smap:ci .
    - docker run --rm smap:ci bash -c "cd schema/test && python test.py"
